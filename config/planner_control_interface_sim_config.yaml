run_mode: kSim
trigger_mode: kManual
init_motion_enable: false
planner_trigger_lead_time: 0.0
smooth_heading_enable: true
init_motion:
  yaw_scan_enable: false # Turn 360 degrees after reaching the final initialization position.
  yaw_scan_rate: 0.35 # Positive yaw reference rate [rad/s], about 20 degrees/s.
  z_takeoff: 1.5
  z_drop: 0.2
  x_forward: 2.0

# Group related parameters to be shared between nodes.
RobotDynamics:
  dt: 0.1
  v_max: 1.0
  v_homing_max: 1.5
  yaw_rate_max: 1.0
